components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        badge_icon:
          type: string
          maxLength: 60
        date_earned:
          type: string
          format: date
          readOnly: true
      required:
      - date_earned
      - id
      - title
    CollaborationStatusEnum:
      enum:
      - open_to_collab
      - available_for_hire
      - mentoring
      - busy
      type: string
      description: |-
        * `open_to_collab` - Open for Collaboration
        * `available_for_hire` - Available for Hire
        * `mentoring` - Mentoring Others
        * `busy` - Focused on Projects / Busy
    PaginatedPublicProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
    PublicProfile:
      type: object
      description: |-
        CRITICAL SECURITY RULE: Public Profile Serializer strictly whitelists public fields.
        Never exposes registered email, mobile phone, password hashes, or session audit logs.
      properties:
        username:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        headline:
          type: string
          maxLength: 160
        bio:
          type: string
          maxLength: 2000
        location:
          type: string
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        github_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        twitter_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        linkedin_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        collaboration_status:
          $ref: '#/components/schemas/CollaborationStatusEnum'
        experience_level:
          type: string
          maxLength: 40
        avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
        joined_date:
          type: string
          format: date-time
          readOnly: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/Achievement'
          readOnly: true
      required:
      - achievements
      - avatar
      - joined_date
      - name
      - skills
      - username
    Skill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 60
        level:
          type: string
          maxLength: 30
      required:
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
