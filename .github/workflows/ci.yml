name: DevSync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devsync_test
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        env:
          SECRET_KEY: test-ci-secret-key-not-for-production-use-devsync
          DATABASE_URL: postgresql://devsync:devsync_password@localhost:5432/devsync_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: devsync.settings.dev
        run: |
          python manage.py check

      - name: Run Migrations
        env:
          SECRET_KEY: test-ci-secret-key-not-for-production-use-devsync
          DATABASE_URL: postgresql://devsync:devsync_password@localhost:5432/devsync_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: devsync.settings.dev
        run: |
          python manage.py migrate

      - name: Run Data Import Test
        env:
          SECRET_KEY: test-ci-secret-key-not-for-production-use-devsync
          DATABASE_URL: postgresql://devsync:devsync_password@localhost:5432/devsync_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: devsync.settings.dev
        run: |
          python manage.py data_import

      - name: Run Tests with Pytest
        env:
          SECRET_KEY: test-ci-secret-key-not-for-production-use-devsync
          DATABASE_URL: postgresql://devsync:devsync_password@localhost:5432/devsync_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: devsync.settings.dev
        run: |
          pytest -v
