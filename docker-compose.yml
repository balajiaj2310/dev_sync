version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devsync_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsync_db}
      POSTGRES_USER: ${POSTGRES_USER:-devsync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsync_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devsync_user} -d ${POSTGRES_DB:-devsync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devsync_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsync_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 devsync.asgi:application"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=devsync.settings.prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-devsync-insecure-prod-key-override-me}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-devsync_user}:${POSTGRES_PASSWORD:-devsync_password}@postgres:5432/${POSTGRES_DB:-devsync_db}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
