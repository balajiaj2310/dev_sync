<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" fill="none">
  <defs>
    <radialGradient id="mintGlow403" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A8F0D0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow403" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111111" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="260" cy="220" r="180" fill="url(#mintGlow403)" />

  <!-- Speech bubble -->
  <g transform="translate(130, 90)">
    <rect x="0" y="0" width="140" height="52" rx="10" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" filter="url(#shadow403)" />
    <path d="M 70,52 L 65,62 L 80,52 Z" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" />
    <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#111111">Hold on!</text>
    <text x="12" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#626A66">You don't have permission.</text>
  </g>

  <!-- Developer Character with raised hand -->
  <!-- Body/Hoodie -->
  <path d="M 190,380 C 180,320 190,240 235,215 C 280,240 290,320 280,380 Z" fill="#1A1F1D" />
  <polygon points="235,260 242,250 249,260 242,270" fill="#86E7BC" />

  <!-- Head -->
  <rect x="226" y="195" width="18" height="25" rx="5" fill="#F8D3B8" />
  <circle cx="235" cy="165" r="38" fill="#F8D3B8" />
  <path d="M 200,165 C 198,130 220,115 245,115 C 270,115 282,135 272,165 C 265,135 250,130 235,130 C 220,135 210,145 200,165 Z" fill="#111111" />
  <!-- Glasses -->
  <rect x="212" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <rect x="238" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <line x1="232" y1="159" x2="238" y2="159" stroke="#111111" stroke-width="2.5" />
  <!-- Eyes -->
  <circle cx="222" cy="159" r="2.5" fill="#111111" />
  <circle cx="248" cy="159" r="2.5" fill="#111111" />
  <!-- Neutral/serious mouth -->
  <line x1="230" y1="184" x2="242" y2="184" stroke="#111111" stroke-width="2" stroke-linecap="round" />

  <!-- Raised Hand Stop Gesture -->
  <path d="M 265,245 C 295,245 320,230 335,200" stroke="#1A1F1D" stroke-width="24" stroke-linecap="round" />
  <!-- Open Palm -->
  <g transform="translate(335, 175)">
    <circle cx="15" cy="15" r="14" fill="#F8D3B8" />
    <rect x="5" y="-8" width="6" height="16" rx="3" fill="#F8D3B8" />
    <rect x="13" y="-12" width="6" height="18" rx="3" fill="#F8D3B8" />
    <rect x="21" y="-10" width="6" height="17" rx="3" fill="#F8D3B8" />
    <rect x="28" y="-4" width="5" height="14" rx="2.5" fill="#F8D3B8" />
  </g>

  <!-- Floating "Access Denied" Red Card -->
  <g transform="translate(360, 120)" filter="url(#shadow403)">
    <rect x="0" y="0" width="140" height="160" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.2" />
    <!-- Big Red Lock -->
    <rect x="42" y="30" width="56" height="50" rx="10" fill="#FDECEC" stroke="#C03939" stroke-width="1.5" />
    <path d="M 56,30 L 56,20 C 56,12 84,12 84,20 L 84,30" stroke="#C03939" stroke-width="3" fill="none" />
    <circle cx="70" cy="52" r="5" fill="#C03939" />
    <line x1="70" y1="57" x2="70" y2="65" stroke="#C03939" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="70" y="112" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#C03939" text-anchor="middle">Access Denied</text>
    <text x="70" y="130" font-family="'Inter', sans-serif" font-size="10" fill="#626A66" text-anchor="middle">403 Restricted</text>
  </g>
</svg>
