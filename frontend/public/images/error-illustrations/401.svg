<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" fill="none">
  <defs>
    <radialGradient id="mintGlow401" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A8F0D0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow401" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111111" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="260" cy="220" r="180" fill="url(#mintGlow401)" />

  <!-- Speech bubble -->
  <g transform="translate(140, 90)">
    <rect x="0" y="0" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" filter="url(#shadow401)" />
    <path d="M 65,52 L 60,62 L 75,52 Z" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" />
    <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#111111">Hey!</text>
    <text x="12" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#626A66">Please sign in to continue.</text>
  </g>

  <!-- Developer Character pointing right -->
  <!-- Body/Hoodie -->
  <path d="M 200,380 C 190,320 200,240 245,215 C 290,240 300,320 290,380 Z" fill="#1A1F1D" />
  <!-- DevSync mint emblem on hoodie -->
  <polygon points="245,260 252,250 259,260 252,270" fill="#86E7BC" />

  <!-- Neck & Face -->
  <rect x="236" y="195" width="18" height="25" rx="5" fill="#F8D3B8" />
  <circle cx="245" cy="165" r="38" fill="#F8D3B8" />
  <!-- Hair -->
  <path d="M 210,165 C 208,130 230,115 255,115 C 280,115 292,135 282,165 C 275,135 260,130 245,135 C 230,140 220,150 210,165 Z" fill="#111111" />
  <!-- Glasses -->
  <rect x="222" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <rect x="248" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <line x1="242" y1="159" x2="248" y2="159" stroke="#111111" stroke-width="2.5" />
  <!-- Eyes & Smile -->
  <circle cx="232" cy="159" r="2.5" fill="#111111" />
  <circle cx="258" cy="159" r="2.5" fill="#111111" />
  <path d="M 239,182 Q 245,188 251,182" stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Arm pointing to card -->
  <path d="M 275,250 C 310,250 330,225 365,220" stroke="#1A1F1D" stroke-width="26" stroke-linecap="round" />
  <circle cx="370" cy="218" r="8" fill="#F8D3B8" />

  <!-- Floating "Sign In Required" Card -->
  <g transform="translate(350, 110)" filter="url(#shadow401)">
    <rect x="0" y="0" width="150" height="180" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.2" />
    <!-- Lock Badge -->
    <rect x="18" y="18" width="26" height="26" rx="6" fill="#E8FBF3" />
    <path d="M 28,28 L 34,28 M 27,33 L 35,33 L 35,38 L 27,38 Z" stroke="#21865B" stroke-width="1.5" fill="none" />
    <text x="52" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#111111">Sign In Required</text>
    
    <!-- Fake inputs -->
    <rect x="18" y="58" width="114" height="24" rx="4" fill="#F7FAF8" stroke="#D8DEDB" />
    <text x="26" y="74" font-family="'Inter', sans-serif" font-size="10" fill="#626A66">Email</text>

    <rect x="18" y="90" width="114" height="24" rx="4" fill="#F7FAF8" stroke="#D8DEDB" />
    <text x="26" y="106" font-family="'Inter', sans-serif" font-size="10" fill="#626A66">Password</text>

    <!-- Login Button -->
    <rect x="18" y="126" width="114" height="28" rx="6" fill="#111111" />
    <text x="58" y="144" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Login</text>
  </g>
</svg>
