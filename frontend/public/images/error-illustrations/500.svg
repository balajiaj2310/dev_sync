<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" fill="none">
  <defs>
    <radialGradient id="mintGlow500" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A8F0D0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow500" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111111" flood-opacity="0.08" />
    </filter>
  </defs>

  <circle cx="260" cy="220" r="180" fill="url(#mintGlow500)" />

  <!-- Speech bubble -->
  <g transform="translate(130, 70)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" filter="url(#shadow500)" />
    <path d="M 72,52 L 68,62 L 82,52 Z" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1" />
    <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#111111">Oops!</text>
    <text x="12" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#626A66">Let me fix this real quick...</text>
  </g>

  <!-- Developer scratching head next to server -->
  <path d="M 190,380 C 180,320 190,240 235,215 C 275,240 285,320 275,380 Z" fill="#1A1F1D" />
  <polygon points="235,260 242,250 249,260 242,270" fill="#86E7BC" />

  <!-- Head -->
  <rect x="226" y="195" width="18" height="25" rx="5" fill="#F8D3B8" />
  <circle cx="235" cy="165" r="38" fill="#F8D3B8" />
  <path d="M 200,165 C 198,130 220,115 245,115 C 270,115 282,135 272,165 C 265,135 250,130 235,130 C 220,135 210,145 200,165 Z" fill="#111111" />
  <!-- Glasses -->
  <rect x="212" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <rect x="238" y="152" width="20" height="15" rx="4" fill="none" stroke="#111111" stroke-width="2.5" />
  <line x1="232" y1="159" x2="238" y2="159" stroke="#111111" stroke-width="2.5" />
  <circle cx="222" cy="159" r="2.5" fill="#111111" />
  <circle cx="248" cy="159" r="2.5" fill="#111111" />
  <ellipse cx="235" cy="183" rx="4" ry="3" fill="#111111" />

  <!-- Hand scratching head -->
  <path d="M 260,240 C 285,210 275,150 255,135" stroke="#1A1F1D" stroke-width="18" stroke-linecap="round" fill="none" />
  <circle cx="250" cy="130" r="7" fill="#F8D3B8" />

  <!-- Floating Server Error 500 Card with warning -->
  <g transform="translate(350, 110)" filter="url(#shadow500)">
    <rect x="0" y="0" width="145" height="165" rx="12" fill="#1A1F1D" stroke="#D8DEDB" stroke-width="1.2" />
    <!-- Server lights & error display -->
    <rect x="15" y="18" width="115" height="40" rx="6" fill="#111111" />
    <circle cx="30" cy="38" r="4" fill="#C03939" />
    <circle cx="45" cy="38" r="4" fill="#A66B14" />
    <circle cx="60" cy="38" r="4" fill="#86E7BC" />
    <line x1="80" y1="38" x2="115" y2="38" stroke="#626A66" stroke-width="2" stroke-linecap="round" />

    <text x="72" y="90" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Server Error</text>
    <text x="72" y="118" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#C03939" text-anchor="middle">500</text>
    <text x="72" y="142" font-family="'Inter', sans-serif" font-size="10" fill="#B8C1BC" text-anchor="middle">Internal Fault</text>
  </g>
</svg>
