<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/layout/responsive.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/cards.css">
  <link rel="stylesheet" href="../../assets/css/components/notifications.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body data-page="auth">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="../public/home.html" class="header-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </a>
      <div class="public-actions">
        <span class="text-secondary" style="font-size: 13.5px;">Don't have an account?</span>
        <a href="sign-up.html" class="btn btn-pill btn-outline btn-sm">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../public/home.html" class="auth-logo">
          <img src="../../../public/images/logo-icon.svg" width="36" height="36" alt="DevSync" />
        </a>
        <h1 class="auth-title">Welcome back to DevSync</h1>
        <p class="auth-subtitle">Sign in to collaborate on your repositories and team projects.</p>
      </div>

      <form id="signInForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Balaji@devsync.dev" value="Balaji@devsync.dev" required autocomplete="username" />
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Password</span>
            <a href="forgot-password.html" class="auth-link" style="font-size: 11.5px; font-weight: 500;">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" value="demo12345" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox" id="rememberMe" class="form-check-input" checked />
          <label for="rememberMe">Remember this browser for 30 days</label>
        </div>

        <button type="submit" class="btn btn-primary btn-pill w-100 btn-lg">Sign In &rarr;</button>
      </form>

      <div class="auth-footer">
        <p>Demo Mode enabled. Any valid password (&ge;8 chars) will authenticate you directly into the workspace shell.</p>
      </div>
    </div>
  </main>

  <footer class="public-footer">
    <div class="public-footer-inner">
      <div class="footer-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </div>
      <div class="footer-links">
        <a href="../public/home.html" class="footer-link">About</a>
        <a href="../settings/privacy.html" class="footer-link">Privacy</a>
        <a href="../public/pricing.html" class="footer-link">Terms</a>
      </div>
    </div>
  </footer>

  <script type="module" src="../../js/main.js"></script>
</body>
</html>
