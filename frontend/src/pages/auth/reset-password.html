<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/layout/responsive.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/cards.css">
  <link rel="stylesheet" href="../../assets/css/components/notifications.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body data-page="auth">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="../public/home.html" class="header-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </a>
      <div class="public-actions">
        <a href="sign-in.html" class="btn btn-pill btn-outline btn-sm">&larr; Back to Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../public/home.html" class="auth-logo">
          <img src="../../../public/images/logo-icon.svg" width="36" height="36" alt="DevSync" />
        </a>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Choose a strong password containing at least 8 characters.</p>
      </div>

      <form id="resetPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="newPassword" class="form-control" placeholder="Minimum 8 characters" required />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-pill w-100 btn-lg">Update Password &rarr;</button>
      </form>
    </div>
  </main>

  <footer class="public-footer">
    <div class="public-footer-inner">
      <div class="footer-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </div>
    </div>
  </footer>

  <script type="module" src="../../js/main.js"></script>
</body>
</html>
