<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/layout/responsive.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/cards.css">
  <link rel="stylesheet" href="../../assets/css/components/notifications.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body data-page="auth">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="../public/home.html" class="header-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </a>
      <div class="public-actions">
        <span class="text-secondary" style="font-size: 13.5px;">Already have an account?</span>
        <a href="sign-in.html" class="btn btn-pill btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../public/home.html" class="auth-logo">
          <img src="../../../public/images/logo-icon.svg" width="36" height="36" alt="DevSync" />
        </a>
        <h1 class="auth-title">Create your DevSync account</h1>
        <p class="auth-subtitle">Join thousands of developers shipping code together.</p>
      </div>

      <form id="signUpForm" class="auth-form" novalidate onsubmit="event.preventDefault(); return false;">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Balaji" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work or Personal Email</label>
          <input type="email" id="email" class="form-control" placeholder="Balaji@devsync.dev" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox" id="termsAgree" class="form-check-input" checked required />
          <label for="termsAgree" style="font-size: 12.5px;">I agree to the <a href="../public/pricing.html" class="auth-link">Terms of Service</a> and <a href="../settings/privacy.html" class="auth-link">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="btn btn-primary btn-pill w-100 btn-lg">Create Account &rarr;</button>
      </form>

      <div class="auth-footer">
        <p>By creating an account, you get access to unlimited repositories and developer community discussions.</p>
      </div>
    </div>
  </main>

  <footer class="public-footer">
    <div class="public-footer-inner">
      <div class="footer-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </div>
      <div class="footer-links">
        <a href="../public/home.html" class="footer-link">About</a>
        <a href="../settings/privacy.html" class="footer-link">Privacy</a>
      </div>
    </div>
  </footer>

  <script type="module" src="../../js/main.js"></script>
  <script type="module">
    import { initAuthPage } from '../../js/pages/auth.js';
    initAuthPage();
  </script>
</body>
</html>
