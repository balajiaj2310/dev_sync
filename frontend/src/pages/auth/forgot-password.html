<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/layout/responsive.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/cards.css">
  <link rel="stylesheet" href="../../assets/css/components/notifications.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body data-page="auth">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="../public/home.html" class="header-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </a>
      <div class="public-actions">
        <a href="sign-in.html" class="btn btn-pill btn-outline btn-sm">&larr; Back to Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../public/home.html" class="auth-logo">
          <img src="../../../public/images/logo-icon.svg" width="36" height="36" alt="DevSync" />
        </a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your registered email, username, or mobile number to receive a 6-digit recovery code.</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <div class="form-group mb-3">
          <label class="form-label" for="recoveryIdentifier">Email, Username, or Mobile</label>
          <input type="text" id="recoveryIdentifier" class="form-control" placeholder="e.g. balaji@devsync.dev or naveen3438" required />
          <span class="text-secondary" style="font-size: 11.5px; display: block; margin-top: 4px;">We'll send a single-use 6-digit verification code.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-pill w-100 btn-lg mb-3" id="btnSendRecovery">Send Recovery Code &rarr;</button>
        <a href="reset-password.html" class="btn btn-outline btn-pill w-100 btn-sm">Already have a code? Set Password</a>
      </form>
    </div>
  </main>

  <footer class="public-footer">
    <div class="public-footer-inner">
      <div class="footer-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </div>
    </div>
  </footer>

  <script type="module" src="../../js/main.js"></script>
</body>
</html>
