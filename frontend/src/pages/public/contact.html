<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/layout/responsive.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/cards.css">
  <link rel="stylesheet" href="../../assets/css/components/notifications.css">
</head>
<body data-page="contact">
  <header class="public-header">
    <div class="public-header-inner">
      <a href="home.html" class="header-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
      </a>
      <nav class="public-nav">
        <a href="home.html" class="nav-link-pill">Home</a>
        <a href="explore.html" class="nav-link-pill">Explore</a>
        <a href="pricing.html" class="nav-link-pill">Pricing</a>
        <a href="contact.html" class="nav-link-pill active">Contact</a>
      </nav>
      <div class="public-actions">
        <a href="../auth/sign-in.html" class="btn btn-pill btn-outline">Sign In</a>
        <a href="../auth/sign-up.html" class="btn btn-pill btn-primary">Get Started &rarr;</a>
      </div>
    </div>
  </header>

  <main class="public-content py-6" style="padding: 60px 0;">
    <div style="max-width: 580px; margin: 0 auto; padding: 0 var(--space-6);">
      <h1 class="font-heading" style="font-size: 30px; margin-bottom: 8px; text-align: center;">Get in touch with DevSync</h1>
      <p class="text-secondary" style="font-size: 14.5px; margin-bottom: 32px; text-align: center;">Have architectural questions, enterprise inquiries, or feature requests? Send us a message.</p>

      <div class="card">
        <form id="contactForm">
          <div class="form-group">
            <label class="form-label" for="contactName">Your Name</label>
            <input type="text" id="contactName" class="form-control" placeholder="Ada Lovelace" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="contactEmail">Work Email</label>
            <input type="email" id="contactEmail" class="form-control" placeholder="ada@company.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="contactMessage">Message</label>
            <textarea id="contactMessage" class="form-control" placeholder="Tell us how we can assist..." rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-pill w-100">Send Message &rarr;</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="public-footer">
    <div class="public-footer-inner">
      <div class="footer-brand">
        <img src="../../../public/images/logo.svg" alt="DevSync" />
        <span class="footer-tagline">Build together. Deploy.</span>
      </div>
      <div class="footer-links">
        <a href="home.html" class="footer-link">About</a>
        <a href="../settings/privacy.html" class="footer-link">Privacy</a>
        <a href="pricing.html" class="footer-link">Terms</a>
        <a href="contact.html" class="footer-link">Help</a>
      </div>
    </div>
  </footer>

  <script type="module" src="../../js/main.js"></script>
</body>
</html>
