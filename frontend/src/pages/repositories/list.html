      <main class="app-content">
        <!-- Page Toolbar (Image 1 Repositories) -->
        <div class="page-toolbar">
          <div class="page-toolbar-title-group">
            <h1 class="text-page-title m-0">Repositories</h1>
          </div>
          <a href="create.html" class="btn btn-primary btn-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Repository
          </a>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <input type="text" id="repoSearchInput" class="form-control search-filter-input" placeholder="Search repositories..." />
          <select id="repoLanguageFilter" class="form-select" style="width: 170px;">
            <option value="All Languages">All Languages</option>
            <option value="Python">Python</option>
            <option value="Django">Django</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
            <option value="Flask">Flask</option>
          </select>
          <select id="repoSortFilter" class="form-select" style="width: 190px;">
            <option value="updated">Sort: Recently Updated</option>
            <option value="stars">Sort: Most Stars</option>
            <option value="name">Sort: Repository Name</option>
          </select>
        </div>

        <!-- Repositories Table (Image 1) -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Language</th>
                <th>Stars</th>
                <th>Forks</th>
                <th>Updated</th>
                <th>Visibility</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="repoTableBody">
              <!-- Dynamically populated via repositories.js -->
            </tbody>
          </table>
        </div>
      </main>
