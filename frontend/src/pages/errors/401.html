  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #F8FAF9; color: #111111; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .header-brand img { height: 28px !important; width: auto !important; max-width: 140px !important; display: block; }
    .footer-brand img { height: 24px !important; width: auto !important; max-width: 120px !important; display: block; }
    .btn-icon-svg { width: 18px !important; height: 18px !important; min-width: 18px !important; min-height: 18px !important; flex-shrink: 0; }
    .social-icon-btn { width: 36px !important; height: 36px !important; min-width: 36px !important; min-height: 36px !important; display: inline-flex !important; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #D8DEDB; background: #FFFFFF; color: #111111; text-decoration: none; }
    .social-icon-btn svg { width: 16px !important; height: 16px !important; min-width: 16px !important; min-height: 16px !important; display: block; }
    .character-render { width: 100%; max-width: 580px; height: auto; display: block; }
  </style>

  <script>
    if (window.location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('link[href^="/"], script[src^="/"], img[src^="/"]').forEach(el => {
          const attr = el.hasAttribute('href') ? 'href' : 'src';
          const val = el.getAttribute(attr);
          if (val && val.startsWith('/src/')) {
            el.setAttribute(attr, '../../' + val.slice(5));
          } else if (val && val.startsWith('/public/')) {
            el.setAttribute(attr, '../../../' + val.slice(1));
          }
        });
      });
    }
  </script>
