<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>429 — Too Many Requests | DevSync</title>
  <link rel="icon" type="image/svg+xml" href="../../public/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout/header.css">
  <link rel="stylesheet" href="../../assets/css/layout/footer.css">
  <link rel="stylesheet" href="../../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../../assets/css/pages/errors.css">
</head>
<body class="error-page" data-page="error">
  <header class="public-navbar">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <a href="../public/home.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <img src="../../public/images/logo.svg" alt="DevSync" height="28">
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="../public/home.html" class="nav-link text-sm fw-medium">Home</a>
        <a href="../public/explore.html" class="nav-link text-sm fw-medium">Explore</a>
        <a href="../auth/sign-in.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="error-container text-center py-5">
    <div class="container">
      <div class="error-illustration-wrapper mb-4">
        <img src="../../public/images/error-illustrations/429.svg" alt="429 Rate Limit Exceeded" class="error-illustration img-fluid">
      </div>
      <h1 class="error-code font-display mb-2">429</h1>
      <h2 class="error-title h4 mb-3">Too Many Requests</h2>
      <p class="error-description text-muted mx-auto mb-4" style="max-width: 480px;">
        You have exceeded the API rate limit threshold. Please pause your requests and try again in a few moments.
      </p>
      <div class="error-actions d-flex justify-content-center gap-3">
        <button onclick="window.location.reload()" class="btn btn-primary">Try Again</button>
        <a href="../public/home.html" class="btn btn-secondary">Return Home</a>
      </div>
    </div>
  </main>

  <footer class="public-footer py-4 border-top mt-auto">
    <div class="container text-center text-muted small">
      <p class="mb-0">© 2026 DevSync Inc. All rights reserved. Developer Collaboration Platform.</p>
    </div>
  </footer>
</body>
</html>
