    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-search-box">
            <span class="topbar-search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="issueSearchInput" class="topbar-search-input" placeholder="Search issues..." />
          </div>
        </div>
        <div class="topbar-right">
          <a href="../notifications/index.html" class="topbar-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
          <div class="dropdown">
            <button class="user-profile-btn" data-dropdown-toggle>
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Naveen" class="user-avatar" />
              <div class="user-info">
                <span class="user-name">Naveen Kumar</span>
                <span class="user-role">Developer</span>
              </div>
            </button>
            <div class="dropdown-menu profile-dropdown-menu">
              <a href="../developers/profile.html" class="dropdown-item">View Profile</a>
              <a href="../profile/edit.html" class="dropdown-item">Edit Profile</a>
              <a href="../settings/account.html" class="dropdown-item">Settings</a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item text-danger" data-action="sign-out">Sign Out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content">
        <!-- Page Header & New Issue Action (Image 1 Issues) -->
        <div class="page-toolbar">
          <h1 class="text-page-title m-0">Issues</h1>
          <a href="create.html" class="btn btn-primary btn-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Issue
          </a>
        </div>

        <!-- Filter Controls (Image 1 Issues) -->
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
          <div class="pr-filter-tabs m-0">
            <button class="pr-tab-btn issue-tab-btn active" data-status="Open">Open <span>12</span></button>
            <button class="pr-tab-btn issue-tab-btn" data-status="Closed">Closed <span>28</span></button>
          </div>

          <div class="d-flex align-items-center gap-3 flex-wrap">
            <select id="issueLabelFilter" class="form-select" style="width: 150px;">
              <option value="All Labels">All Labels</option>
              <option value="enhancement">enhancement</option>
              <option value="bug">bug</option>
              <option value="UI">UI</option>
              <option value="database">database</option>
            </select>
            <select id="issueRepoFilter" class="form-select" style="width: 170px;">
              <option value="All Repositories">All Repositories</option>
              <option value="portfolio-site">portfolio-site</option>
              <option value="campus-connect">campus-connect</option>
              <option value="devsync-core">devsync-core</option>
              <option value="chaturya-club">chaturya-club</option>
            </select>
            <select class="form-select" style="width: 150px;">
              <option value="newest">Sort: Newest</option>
              <option value="recently-updated">Sort: Recently Updated</option>
            </select>
          </div>
        </div>

        <!-- Issues Table (Image 1) -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Repository</th>
                <th>Labels</th>
                <th>Author</th>
                <th>Comments</th>
                <th>Updated</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="issueTableBody">
              <!-- Dynamically populated via issues.js -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/main.js"></script>
</body>
</html>
