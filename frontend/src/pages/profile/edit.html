    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-search-box">
            <input type="text" class="topbar-search-input" placeholder="Search..." />
          </div>
        </div>
        <div class="topbar-right">
          <a href="../notifications/index.html" class="topbar-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Naveen" class="user-avatar" />
        </div>
      </header>

      <main class="app-content">
        <div style="max-width: 820px; margin: 0 auto;">
          <h1 class="text-page-title mb-1">Public Profile</h1>
          <p class="text-secondary mb-6" style="font-size: 14px;">This information will be displayed publicly to other developers on the platform.</p>

          <form id="profileEditForm" class="profile-editor-layout">
            <div class="avatar-upload-col">
              <img id="avatarPreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&q=80" alt="Profile" class="avatar-preview-lg" />
              <input type="file" id="avatarUploadInput" style="display: none;" accept="image/*" />
              <button type="button" class="btn btn-outline btn-sm w-100" onclick="document.getElementById('avatarUploadInput').click();">Upload Avatar</button>
              <span class="text-helper">PNG, JPG up to 5MB</span>
            </div>

            <div class="d-flex flex-column gap-3">
              <div class="form-group">
                <label class="form-label" for="displayName">Display Name</label>
                <input type="text" id="displayName" class="form-control" placeholder="Naveen Kumar" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="naveenkumar" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="bio">Bio</label>
                <textarea id="bio" class="form-control" rows="3" placeholder="Tell other developers what you are building..."></textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="skills">Skills <span class="optional">(comma separated)</span></label>
                <input type="text" id="skills" class="form-control" placeholder="Python, Django, JavaScript, Docker" />
              </div>

              <div class="form-group mb-4">
                <label class="form-label" for="website">Personal Website</label>
                <input type="url" id="website" class="form-control" placeholder="https://example.dev" />
              </div>

              <div class="d-flex align-items-center justify-content-end gap-3 pt-4" style="border-top: 1px solid var(--color-border);">
                <a href="../developers/profile.html" class="btn btn-outline btn-pill">Cancel</a>
                <button type="submit" class="btn btn-primary btn-pill">Save Profile Changes &rarr;</button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
